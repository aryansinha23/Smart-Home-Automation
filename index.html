<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumen Wallet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0A0F14;
    --surface: #12181F;
    --surface-2: #1A222B;
    --hairline: #262F3A;
    --text-primary: #EDEAE2;
    --text-muted: #7C8A93;
    --amber: #E8B04B;
    --amber-dim: #3E3320;
    --cyan: #4FC6D9;
    --cyan-dim: #17323A;
    --violet: #A78BE0;
    --violet-dim: #2A2440;
    --red: #E2635C;
    --red-dim: #3A2020;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  body{
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'IBM Plex Sans', sans-serif;
    padding: 40px 24px 80px;
    min-height: 100vh;
  }

  .wrap{ max-width: 1080px; margin: 0 auto; }

  /* ---- Header ---- */
  header{
    display:flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 20px;
    padding-bottom: 28px;
    border-bottom: 1px solid var(--hairline);
    margin-bottom: 32px;
  }
  .brand{ display:flex; align-items:center; gap: 10px; }
  .brand-mark{
    width: 34px; height: 34px;
    border-radius: 9px;
    background: linear-gradient(155deg, var(--amber), #B9822A);
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700; color:#0A0F14; font-size:16px;
  }
  .brand-name{ font-family:'Space Grotesk', sans-serif; font-size: 19px; font-weight: 600; }
  .brand-sub{ font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }

  .hero-figure{ text-align: right; }
  .hero-figure .label{ font-size: 12.5px; color: var(--text-muted); margin-bottom: 4px; }
  .hero-figure .value{
    font-family:'Space Grotesk', sans-serif;
    font-size: 34px; font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .hero-figure .value span{ font-size: 15px; color: var(--text-muted); font-weight: 500; }

  /* ---- Room accounts ---- */
  .accounts{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    margin-bottom: 28px;
  }
  @media (max-width: 900px){ .accounts{ grid-template-columns: 1fr; } }

  .account{
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 16px;
    padding: 20px;
    display:flex;
    flex-direction:column;
  }

  .account-top{
    display:flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 14px;
  }
  .account-name{ font-family:'Space Grotesk', sans-serif; font-size: 17px; font-weight: 600; }
  .status-pill{
    font-size: 11px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .status-pill.on{ background: var(--amber-dim); color: var(--amber); }
  .status-pill.off{ background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--hairline); }

  .gauge-row{
    display:flex;
    align-items:center;
    gap: 16px;
    padding: 10px 0 16px;
  }
  .gauge-numbers{ flex:1; }
  .balance-label{ font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
  .balance-value{
    font-family:'Space Grotesk', sans-serif;
    font-size: 26px; font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .balance-value span{ font-size: 14px; color: var(--text-muted); font-weight: 500; margin-left: 2px;}

  .ledger-title{
    font-size: 12px;
    color: var(--text-muted);
    margin: 8px 0 10px;
    display:flex; justify-content: space-between;
  }
  .ledger{ display:flex; flex-direction:column; gap: 7px; flex: 1; }
  .entry{
    display:flex;
    align-items:center;
    gap: 10px;
    padding: 9px 10px;
    border-radius: 10px;
    background: var(--surface-2);
  }
  .entry.failed{ background: transparent; border: 1px dashed var(--hairline); opacity: 0.75; }
  .entry-icon{
    width: 26px; height: 26px;
    border-radius: 7px;
    display:flex; align-items:center; justify-content:center;
    font-size: 12.5px;
    flex-shrink: 0;
  }
  .entry-icon.power-on{ background: var(--amber-dim); color: var(--amber); }
  .entry-icon.power-off{ background: var(--surface); color: var(--text-muted); border: 1px solid var(--hairline); }
  .entry-icon.adjust{ background: var(--cyan-dim); color: var(--cyan); }
  .entry-icon.blocked{ background: var(--red-dim); color: var(--red); }

  .entry-info{ flex: 1; min-width: 0; }
  .entry-title{ font-size: 12.5px; font-weight: 500; }
  .entry-sub{ font-size: 10.5px; color: var(--text-muted); margin-top: 1px; }
  .entry-amount{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    text-align: right;
    white-space: nowrap;
  }
  .entry-amount.adjust{ color: var(--cyan); }
  .entry-amount.blocked{ color: var(--red); }
  .entry-amount.neutral{ color: var(--text-muted); }

  /* ---- Grid overview ---- */
  .compare{
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 16px;
    padding: 22px;
  }
  .compare-title{ font-family:'Space Grotesk', sans-serif; font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .compare-sub{ font-size: 12.5px; color: var(--text-muted); margin-bottom: 18px; }

  .bar-row{ margin-bottom: 14px; }
  .bar-label{ display:flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
  .bar-label .amt{ font-family:'IBM Plex Mono', monospace; color: var(--text-muted); }
  .bar-track{ height: 10px; background: var(--surface-2); border-radius: 6px; overflow: hidden; }
  .bar-fill{ height: 100%; border-radius: 6px; }

  .verdict{
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--hairline);
    font-size: 13.5px;
    color: var(--text-muted);
  }
  .verdict b{ color: var(--text-primary); font-weight: 600; }

  footer{
    text-align:center;
    font-size: 11.5px;
    color: var(--text-muted);
    margin-top: 40px;
  }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <div class="brand">
      <div class="brand-mark">LW</div>
      <div>
        <div class="brand-name">Lumen Wallet</div>
        <div class="brand-sub">Room-by-room power &amp; brightness ledger</div>
      </div>
    </div>
    <div class="hero-figure">
      <div class="label">Lights currently on</div>
      <div class="value" id="lightsOn">– <span>of 3 rooms</span></div>
    </div>
  </header>

  <div class="accounts" id="accounts"></div>

  <div class="compare">
    <div class="compare-title">Brightness across the house</div>
    <div class="compare-sub">Current output per room, on a 0–100 scale.</div>
    <div id="compareBars"></div>
    <div class="verdict" id="verdict"></div>
  </div>

  <footer>Ledger is simulated from each bulb's local state, not a live device feed.</footer>

</div>

<script>
  /* =========================================================
     SmartLight logic — ported 1:1 from the Python class.
     togglePower(), setBrightness() and getStatus() keep the
     same rules; each call also pushes a ledger entry for the
     UI below.
     ========================================================= */

  class SmartLight {
    constructor(roomLocation, isOn = false, brightness = 0) {
      this.roomLocation = roomLocation;
      this.isOn = isOn;
      this.brightness = brightness;
      this.ledger = [];
    }

    togglePower() {
      this.isOn = !this.isOn;
      if (!this.isOn) {
        this.brightness = 0; // an off light holds no brightness reading
      }
      this.ledger.push({
        type: this.isOn ? "power-on" : "power-off",
        title: this.isOn ? "Powered on" : "Powered off",
        sub: this.isOn ? "Ready to adjust brightness" : "Brightness reset to 0%",
        amount: this.isOn ? "ON" : "OFF"
      });
    }

    setBrightness(level) {
      if (!this.isOn) {
        this.ledger.push({
          type: "blocked",
          title: `Set brightness → ${level}%`,
          sub: "Declined — light is OFF",
          amount: "Declined"
        });
        return;
      }
      if (level < 0 || level > 100) {
        this.ledger.push({
          type: "blocked",
          title: `Set brightness → ${level}%`,
          sub: "Declined — out of 0–100 range",
          amount: "Declined"
        });
        return;
      }
      this.brightness = level;
      this.ledger.push({
        type: "adjust",
        title: "Brightness adjusted",
        sub: `Set to ${level}%`,
        amount: `${level}%`
      });
    }

    getStatus() {
      return { room: this.roomLocation, isOn: this.isOn, brightness: this.brightness };
    }
  }

  /* ---- Run the same sequence as the Python main() ---- */
  const livingRoom = new SmartLight("Living Room");
  const kitchen = new SmartLight("Kitchen");
  const study = new SmartLight("Study");

  livingRoom.togglePower();        // ON
  livingRoom.setBrightness(75);    // succeeds

  study.togglePower();             // ON
  study.setBrightness(30);         // succeeds

  kitchen.setBrightness(50);       // declined — still OFF

  livingRoom.setBrightness(150);   // declined — out of range

  study.togglePower();             // OFF, brightness resets to 0

  /* =========================================================
     Rendering — banking-app style room accounts + ledger
     ========================================================= */

  function iconFor(entry) {
    if (entry.type === "power-on") return "⏻";
    if (entry.type === "power-off") return "⏻";
    if (entry.type === "adjust") return "◎";
    return "×";
  }

  function gaugeSVG(pct, color) {
    const r = 27, stroke = 6, c = 2 * Math.PI * r;
    const offset = c * (1 - pct);
    return `
      <svg width="68" height="68" viewBox="0 0 68 68" style="flex-shrink:0;">
        <circle cx="34" cy="34" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="${stroke}"/>
        <circle cx="34" cy="34" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
          stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${offset}"
          transform="rotate(-90 34 34)"/>
        <text x="34" y="39" text-anchor="middle" font-family="Space Grotesk, sans-serif"
          font-size="13" font-weight="600" fill="var(--text-primary)">${Math.round(pct*100)}%</text>
      </svg>
    `;
  }

  function accountCardHTML(light, accentColor) {
    const pct = light.brightness / 100;

    const entriesHTML = light.ledger.map(e => `
      <div class="entry ${e.type === 'blocked' ? 'failed' : ''}">
        <div class="entry-icon ${e.type}">${iconFor(e)}</div>
        <div class="entry-info">
          <div class="entry-title">${e.title}</div>
          <div class="entry-sub">${e.sub}</div>
        </div>
        <div class="entry-amount ${e.type === 'adjust' ? 'adjust' : e.type === 'blocked' ? 'blocked' : 'neutral'}">${e.amount}</div>
      </div>
    `).join("");

    return `
      <div class="account">
        <div class="account-top">
          <div class="account-name">${light.roomLocation}</div>
          <div class="status-pill ${light.isOn ? 'on' : 'off'}">${light.isOn ? 'ON' : 'OFF'}</div>
        </div>

        <div class="gauge-row">
          ${gaugeSVG(pct, accentColor)}
          <div class="gauge-numbers">
            <div class="balance-label">Brightness</div>
            <div class="balance-value">${light.brightness}<span>%</span></div>
          </div>
        </div>

        <div class="ledger-title"><span>Activity</span><span>${light.ledger.length} events</span></div>
        <div class="ledger">${entriesHTML}</div>
      </div>
    `;
  }

  document.getElementById("accounts").innerHTML =
    accountCardHTML(livingRoom, "#E8B04B") +
    accountCardHTML(kitchen, "#4FC6D9") +
    accountCardHTML(study, "#A78BE0");

  const rooms = [
    { light: livingRoom, color: "#E8B04B" },
    { light: kitchen, color: "#4FC6D9" },
    { light: study, color: "#A78BE0" }
  ];

  const onCount = rooms.filter(r => r.light.isOn).length;
  document.getElementById("lightsOn").innerHTML = `${onCount} <span>of 3 rooms</span>`;

  document.getElementById("compareBars").innerHTML = rooms.map(r => `
    <div class="bar-row">
      <div class="bar-label"><span>${r.light.roomLocation}</span><span class="amt">${r.light.brightness}%</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${r.light.brightness}%; background:${r.color};"></div></div>
    </div>
  `).join("");

  const brightest = rooms.reduce((a, b) => (b.light.brightness > a.light.brightness ? b : a));
  document.getElementById("verdict").innerHTML = brightest.light.brightness > 0
    ? `<b>${brightest.light.roomLocation}</b> is currently the brightest room, at ${brightest.light.brightness}%.`
    : `No room is currently lit.`;
</script>

</body>
</html>
